[package]
name = "wormhole-desktop"
version = "0.0.0"
edition = "2021"
authors.workspace = true
publish = false
license = "MIT"
description = "Wormhole desktop (Warp native UI + wormhole-desktop-core)"

[[bin]]
name = "wormhole-desktop"
path = "src/main.rs"

[features]
default = ["media-ffmpeg", "remote-desktop", "native-ui"]
media-ffmpeg = ["wormhole-desktop-core/media-ffmpeg"]
remote-desktop = ["wormhole-desktop-core/remote-desktop"]
native-ui = ["wormhole-desktop-core/native-ui"]

[dependencies]
anyhow.workspace = true
asset_cache.workspace = true
async-channel.workspace = true
axum.workspace = true
clap = { version = "4", features = ["derive"] }
command.workspace = true
display-core = { path = "../../../../crates/display-core" }
display-server = { path = "../../../../crates/display-server" }
futures.workspace = true
log.workspace = true
pathfinder_color.workspace = true
pathfinder_geometry.workspace = true
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }
vt100 = "0.15"
warpui.workspace = true
warpui_core.workspace = true
wormhole-desktop-core = { path = "../../../../crates/wormhole-desktop-core", default-features = false }
wormhole-native-ipc = { path = "../../../../crates/wormhole-native-ipc" }
wormhole-desktop-rdp = { path = "../../../../crates/wormhole-desktop-rdp", features = [
  "iroh-transport",
  "rdp",
  "vram-capture",
  "opus-audio",
  "clipboard-sync",
] }
storage-core = { path = "../../../../crates/storage-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
arboard = "3"
chrono = { workspace = true, features = ["clock"] }
resvg.workspace = true
tiny-skia = "0.12.0"
tempfile = "3"

[dev-dependencies]
owned_ttf_parser = "0.25.0"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
computer-use = { path = "../../../../crates/computer-use" }

[target.'cfg(not(windows))'.dependencies]
rfd = "0.15"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
wormhole-desktop-tray = { path = "../../../../crates/wormhole-desktop-tray" }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"
wormhole-desktop-platform-windows = { path = "../../../../crates/wormhole-desktop-platform-windows" }
windows-version = "0.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"
