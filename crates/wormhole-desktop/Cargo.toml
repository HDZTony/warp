[package]
name = "wormhole-desktop"
version = "0.0.0"
edition = "2021"
authors.workspace = true
publish = false
license = "MIT"
description = "Wormhole desktop (Warp native UI + wormhole-desktop-core)"

[[bin]]
name = "wormhole-desktop"
path = "src/main.rs"

[features]
default = ["media-ffmpeg", "remote-desktop"]
media-ffmpeg = ["wormhole-desktop-core/media-ffmpeg"]
remote-desktop = ["wormhole-desktop-core/remote-desktop"]

[dependencies]
anyhow.workspace = true
asset_cache.workspace = true
async-channel.workspace = true
clap = { version = "4", features = ["derive"] }
command.workspace = true
display-core = { path = "../../../../crates/display-core" }
display-server = { path = "../../../../crates/display-server" }
futures.workspace = true
log.workspace = true
pathfinder_color.workspace = true
pathfinder_geometry.workspace = true
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }
vt100 = "0.15"
warpui.workspace = true
warpui_core.workspace = true
wormhole-desktop-core = { path = "../../../../crates/wormhole-desktop-core", default-features = false }
wormhole-desktop-rdp = { path = "../../../../crates/wormhole-desktop-rdp", features = [
  "iroh-transport",
  "media-ffmpeg",
  "rdp",
  "vram-capture",
  "opus-audio",
  "clipboard-sync",
] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
computer-use = { path = "../../../../crates/computer-use" }

[target.'cfg(windows)'.dependencies]
wormhole-desktop-platform-windows = { path = "../../../../crates/wormhole-desktop-platform-windows" }
windows-sys = { version = "0.61", features = [
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
] }
